<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formas de Aplicar CSS</title>
    <h2>@arthurzin7</h2>
</head>
<body>
    <h1>Formas de Aplicar CSS</h1>

    <!-- Inline (na propia tag HTML) -->
    <p style="color:blue">texto azul</p>

    <!-- intarno (no head do html) -->
     <style>
        p {
            color:green;
        }
     </style>

     <!-- extremo (arquivo aeparados) -->
      <p class="texto">forma mais recomendada
        para projetos reais</p>
    
</body>
</html>
